<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Criar Mundo - WorldBox Infinity</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { 
    width: 100%; height: 100%; 
    background-color: #1a1a1a; background-image: repeating-linear-gradient(45deg, #1a1a1a 25%, transparent 25%, transparent 75%, #1a1a1a 75%, #1a1a1a), repeating-linear-gradient(45deg, #1a1a1a 25%, #222 25%, #222 75%, #1a1a1a 75%, #1a1a1a);
    background-position: 0 0, 4px 4px; background-size: 8px 8px;
    font-family: 'Press Start 2P', monospace; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
  }
  #main-panel {
    background: rgba(15, 15, 15, 0.9); width: 100%; max-width: 800px; height: 100%; max-height: 650px;
    display: flex; flex-direction: column; border-top: 2px solid #333; border-bottom: 2px solid #333; position: relative;
  }
  .tabs { display: flex; justify-content: space-around; padding: 20px 0 0 0; border-bottom: 1px solid #333; margin-bottom: 20px; }
  .tab { font-size: clamp(8px, 2vw, 12px); color: #777; cursor: pointer; padding-bottom: 15px; text-shadow: 2px 2px 0 #000; }
  .tab.active { color: #fff; border-bottom: 3px solid #fff; }
  #content-area { flex: 1; overflow-y: auto; padding: 0 20px; display: flex; flex-direction: column; align-items: center; }
  
  .input-group { width: 100%; max-width: 500px; margin-bottom: 20px; }
  .input-group label { display: block; font-size: 10px; margin-bottom: 10px; text-shadow: 2px 2px 0 #000; }
  input[type="text"] { width: 100%; padding: 12px; background: #000; border: 2px solid #555; color: #fff; font-family: inherit; font-size: 12px; outline: none; }
  input[type="text"]:focus { border-color: #aaa; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 500px; margin-bottom: 20px; }
  
  .btn {
    padding: 12px; font-family: inherit; font-size: clamp(8px, 1.5vw, 10px); color: #fff;
    background: linear-gradient(#7a7a7a, #5a5a5a); border: 2px solid #2b2b2b; border-top-color: #9a9a9a; border-left-color: #9a9a9a;
    text-shadow: 2px 2px 0 #000; cursor: pointer; text-align: center; transition: background 0.1s;
  }
  .btn:hover { background: linear-gradient(#8a8a8a, #6a6a6a); }
  .btn:active { transform: translateY(2px); }
  .btn-full { width: 100%; max-width: 500px; margin-bottom: 10px; }
  .desc-text { font-size: 8px; color: #aaa; margin-top: 5px; margin-bottom: 20px; width: 100%; max-width: 500px; line-height: 1.5; text-shadow: 1px 1px 0 #000; }

  #footer { display: flex; justify-content: center; gap: 20px; padding: 20px; background: rgba(0,0,0,0.5); border-top: 1px solid #333; }
  #footer .btn { width: 200px; }
  #btn-create { color: #55ff55; }

  .tab-content { display: none; width: 100%; align-items: center; flex-direction: column; }
  .tab-content.active { display: flex; }

  .biome-btn.active { border: 3px solid #fff; transform: scale(1.05); }
</style>
</head>
<body>

<div id="main-panel">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('general', event)">General</div>
    <div class="tab" onclick="switchTab('world', event)">World</div>
    <div class="tab" onclick="switchTab('rules', event)">Game Rules</div>
  </div>

  <div id="content-area">
    
    <div id="tab-general" class="tab-content active">
      <div class="input-group">
        <label>World Name</label>
        <input type="text" id="world-name" value="New World_" maxlength="30">
      </div>
      <div class="input-group">
        <label>World Seed (Opcional)</label>
        <input type="text" id="world-seed" placeholder="Ex: 123456 ou 'worldengine'">
      </div>
      <div class="grid-2">
        <button class="btn" id="btn-gamemode">Game Mode: Survival</button>
        <button class="btn" id="btn-difficulty">Difficulty: Normal</button>
      </div>
      <div class="desc-text">Search for resources, craft, gain levels, health and hunger</div>
      <div class="grid-2">
        <button class="btn" id="btn-cheats">Allow Cheats: OFF</button>
        <button class="btn">Data Packs</button>
      </div>
      <button class="btn btn-full">Experiments</button>
    </div>

    <div id="tab-world" class="tab-content">
      <div class="desc-text" style="text-align: center; margin-bottom: 20px; font-size: 10px;">
        Escolha o Bioma Principal do mundo:
      </div>
      
      <div class="grid-2">
        <button class="btn biome-btn active" id="biome-plains" style="background: linear-gradient(#7a9e5a, #5a7e3a);">Planície</button>
        <button class="btn biome-btn" id="biome-desert" style="background: linear-gradient(#e6c27e, #c6a25e);">Deserto</button>
        <button class="btn biome-btn" id="biome-snow" style="background: linear-gradient(#d0e0e8, #a0b0b8);">Neve</button>
        <button class="btn biome-btn" id="biome-savanna" style="background: linear-gradient(#b8c25a, #98a23a);">Pradaria</button>
      </div>
      
      <div class="desc-text" style="text-align: center; margin-top: 20px;">
        O bioma altera o clima, a cor da grama e a textura das árvores.
      </div>
    </div>

    <div id="tab-rules" class="tab-content">
      <div class="desc-text" style="text-align: center; margin-top: 50px;">
        Configurações de regras do jogo.
      </div>
    </div>
  </div>

  <div id="footer">
    <button class="btn" id="btn-create">Create New World</button>
    <button class="btn" id="btn-cancel">Cancel</button>
  </div>
</div>

<script>
  function switchTab(tabId, event) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tabId).classList.add('active');
  }

  let isSurvival = true;
  document.getElementById('btn-gamemode').onclick = function() {
    isSurvival = !isSurvival;
    this.innerText = `Game Mode: ${isSurvival ? 'Survival' : 'Creative'}`;
  };

  let isNormalDiff = true;
  document.getElementById('btn-difficulty').onclick = function() {
    isNormalDiff = !isNormalDiff; 
    this.innerText = `Difficulty: ${isNormalDiff ? 'Normal' : 'Hardcore'}`;
  };

  let cheatsOn = false;
  document.getElementById('btn-cheats').onclick = function() {
    cheatsOn = !cheatsOn;
    this.innerText = `Allow Cheats: ${cheatsOn ? 'ON' : 'OFF'}`;
  };

  let selectedBiome = 'plains';
  const biomeBtns = document.querySelectorAll('.biome-btn');
  
  biomeBtns.forEach(btn => {
    btn.onclick = () => {
      biomeBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedBiome = btn.id.replace('biome-', '');
    };
  });

  document.getElementById('btn-cancel').onclick = () => window.location.href = 'index.html';

  document.getElementById('btn-create').onclick = () => {
    const worldName = document.getElementById('world-name').value.trim();
    const worldSeed = document.getElementById('world-seed').value.trim();
    
    if (!worldName) { alert("Por favor, digite um nome para o mundo!"); return; }
    
    const config = {
      name: worldName,
      seed: worldSeed || '0',
      gamemode: isSurvival ? 'survival' : 'creative',
      difficulty: isNormalDiff ? 'normal' : 'hardcore',
      cheats: cheatsOn,
      biome: selectedBiome
    };
    
    localStorage.setItem('worldConfig', JSON.stringify(config));
    window.location.href = 'jogo.html'; 
  };
</script>
</body>
</html>
